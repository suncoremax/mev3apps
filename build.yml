name: Build client app (APK + Windows EXE)

on:
  workflow_dispatch:
    inputs:
      app_name:      { description: 'App name (e.g. My Shop)', required: true }
      package_name:  { description: 'Package name (e.g. com.gk.myshop1234) - new name = installs as NEW app', required: true }
      app_url:       { description: 'Web app link (https://...)', required: true }
      logo_url:      { description: 'Logo image link (direct PNG/JPG URL). Empty = use logo.png in this repo', required: false, default: '' }
      icon_bg:       { description: 'Android icon background colour', required: false, default: '#FFFFFF' }
      keyboard:      { description: 'Windows: keyboard shortcuts', type: boolean, default: true }
      build_android: { description: 'Build Android APK', type: boolean, default: true }
      build_windows: { description: 'Build Windows EXE', type: boolean, default: true }

env:
  APP_NAME: ${{ inputs.app_name }}
  PKG: ${{ inputs.package_name }}
  APP_URL: ${{ inputs.app_url }}
  LOGO_URL: ${{ inputs.logo_url }}
  ICON_BG: ${{ inputs.icon_bg }}
  KEYBOARD: ${{ inputs.keyboard }}

jobs:
  android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Apply client settings
        run: pip install pillow && python tools/prepare.py android
      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: APK-${{ inputs.package_name }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Apply client settings
        run: pip install pillow && python tools/prepare.py windows
      - name: Build EXE installer
        working-directory: windows
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: EXE-${{ inputs.package_name }}
          path: windows/dist/*.exe
          retention-days: 30
