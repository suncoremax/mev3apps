name: Build client app (APK + Windows EXE)

on:
  workflow_dispatch:
    inputs:
      app_name:      { description: 'App name (e.g. My Shop)', required: true }
      package_name:  { description: 'Package name (e.g. com.gk.myshop1234) - new name = installs as NEW app', required: true }
      app_url:       { description: 'Web app link (https://...)', required: true }
      logo_png:      { description: 'LOGO PNG - first upload it to the repo logos/ folder. Leave EMPTY = newest PNG uploaded there. Or type its file name (e.g. shop.png)', required: false, default: '' }
      icon_bg:       { description: 'Android icon background colour', required: false, default: '#FFFFFF' }
      keyboard:      { description: 'Windows: extra keyboard shortcuts (F5, F11, Ctrl+P ... ). Esc/Alt+Left = Back is always on', type: boolean, default: true }
      build_android: { description: 'Build Android APK', type: boolean, default: true }
      build_windows: { description: 'Build Windows EXE', type: boolean, default: true }

env:
  APP_NAME: ${{ inputs.app_name }}
  PKG: ${{ inputs.package_name }}
  APP_URL: ${{ inputs.app_url }}
  LOGO_FILE: ${{ inputs.logo_png }}
  ICON_BG: ${{ inputs.icon_bg }}
  KEYBOARD: ${{ inputs.keyboard }}

jobs:
  android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Apply client settings
        run: pip install pillow && python tools/prepare.py android
      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: APK-${{ inputs.package_name }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Apply client settings
        run: pip install pillow && python tools/prepare.py windows
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-win-${{ runner.os }}-v1
      - name: Build EXE installer (auto-retry on network errors)
        working-directory: windows
        run: |
          for i in 1 2 3 4 5; do
            echo "=== attempt $i ==="
            if [ "$i" -ge 3 ]; then
              echo "using backup download mirror"
              export ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/"
              export ELECTRON_BUILDER_BINARIES_MIRROR="https://npmmirror.com/mirrors/electron-builder-binaries/"
            fi
            rm -rf node_modules dist
            if npm install --no-audit --no-fund && npx electron-builder --win nsis --publish never; then
              exit 0
            fi
            echo "failed, retrying in $((i*20))s"; sleep $((i*20))
          done
          echo "All attempts failed (GitHub/network problem). Re-run the workflow later."; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: EXE-${{ inputs.package_name }}
          path: windows/dist/*.exe
          retention-days: 30
